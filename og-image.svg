<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient: dark navy top to slightly lighter navy bottom -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#1B3A5C"/>
    </linearGradient>

    <!-- Bottom strip gradient -->
    <linearGradient id="stripGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3F62"/>
      <stop offset="100%" stop-color="#163350"/>
    </linearGradient>

    <!-- Star glow filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text glow -->
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for the whole image -->
    <clipPath id="imageClip">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <g clip-path="url(#imageClip)">

    <!-- ══════════════════════════════════════════════ -->
    <!-- BACKGROUND                                      -->
    <!-- ══════════════════════════════════════════════ -->
    <rect width="1200" height="630" fill="url(#bgGradient)"/>

    <!-- Very subtle noise/texture overlay using tiny circles -->
    <circle cx="120" cy="80" r="180" fill="#1a3050" opacity="0.25"/>
    <circle cx="1080" cy="120" r="200" fill="#0d2240" opacity="0.2"/>
    <circle cx="600" cy="300" r="320" fill="#163050" opacity="0.12"/>


