    <!-- ══════════════════════════════════════════════ -->
    <!-- PILL BADGES                                    -->
    <!-- ══════════════════════════════════════════════ -->
    <!-- Three badges centered, roughly 190px wide each, 10px gap -->
    <!-- Total width: 3×190 + 2×16 = 602px, centered at 600 → starts at 299 -->

    <!-- Badge 1: "16 Chapters" — x starts at 299 -->
    <rect x="299" y="398" width="190" height="40" rx="20" ry="20"
