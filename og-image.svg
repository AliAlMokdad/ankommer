    <rect x="0" y="4" width="1200" height="2" fill="#FFFFFF" opacity="0.25"/>


    <!-- ══════════════════════════════════════════════ -->
    <!-- STARS (scattered in upper portion)             -->
    <!-- ══════════════════════════════════════════════ -->
