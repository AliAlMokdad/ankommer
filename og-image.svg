    <!-- ══════════════════════════════════════════════ -->
    <!-- DANISH FLAG EMOJI AREA (top-left)              -->
    <!-- ══════════════════════════════════════════════ -->
    <!-- Flag badge background -->
    <rect x="60" y="52" width="80" height="50" rx="8" ry="8"
          fill="#0F1B2D" stroke="#2a4a6a" stroke-width="1.5" opacity="0.85"/>
    <!-- Actual Danish flag (🇩🇰): red rectangle with white cross -->
    <!-- Flag proportions: 28:37, cross bar at roughly 12/28 from left -->
    <rect x="68" y="59" width="65" height="36" rx="3" fill="#C60C30"/>
    <!-- Vertical bar of cross -->
    <rect x="88" y="59" width="10" height="36" fill="#FFFFFF"/>
    <!-- Horizontal bar of cross -->
    <rect x="68" y="72" width="65" height="10" fill="#FFFFFF"/>


