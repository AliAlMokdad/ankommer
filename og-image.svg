    <!-- Second layer of buildings for depth -->
    <path d="
      M0,560 L0,545 L40,545 L40,555 L80,555 L80,550 L110,550 L110,545
      L150,545 L150,555 L190,555 L190,550 L220,550 L220,545 L260,545
