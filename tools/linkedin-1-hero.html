<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px; height: 1500px;
    background: radial-gradient(ellipse at 50% 30%, #1B3258 0%, #0F1B2D 60%, #060D1A 100%);
    color: white;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Stars */
  .stars { position: absolute; inset: 0; opacity: 0.7; }
  .stars::before, .stars::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 80px 220px, white 50%, transparent),
      radial-gradient(1px 1px at 280px 480px, white 50%, transparent),
      radial-gradient(2px 2px at 580px 90px, white 50%, transparent),
      radial-gradient(1px 1px at 920px 760px, white 50%, transparent),
      radial-gradient(1.5px 1.5px at 1080px 280px, white 50%, transparent),
      radial-gradient(2px 2px at 180px 680px, rgba(255,255,255,0.7) 50%, transparent),
      radial-gradient(1px 1px at 780px 1020px, white 50%, transparent),
      radial-gradient(1.5px 1.5px at 400px 1180px, white 50%, transparent),
      radial-gradient(1px 1px at 1100px 1280px, white 50%, transparent),
      radial-gradient(2px 2px at 60px 1340px, rgba(255,255,255,0.7) 50%, transparent);
  }

  /* Aurora glow */
  .aurora {
    position: absolute; top: 0; left: 0; right: 0; height: 60%;
    background:
      radial-gradient(ellipse 800px 400px at 50% 0%, rgba(255, 77, 106, 0.12), transparent 70%),
      radial-gradient(ellipse 600px 300px at 30% 20%, rgba(64, 156, 255, 0.08), transparent 70%);
    pointer-events: none;
  }

  /* Skyline silhouette at bottom */
  .skyline {
    position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #060D1A;
    clip-path: polygon(
      0 100%, 0 70%,
      50px 70%, 55px 55%, 80px 55%, 85px 70%,
      130px 70%, 135px 40%, 155px 40%, 160px 30%, 180px 30%, 185px 40%, 205px 40%, 210px 70%,
      260px 70%, 265px 55%, 295px 55%, 300px 70%,
      350px 70%, 355px 45%, 400px 45%, 405px 70%,
      460px 70%, 465px 35%, 495px 35%, 500px 25%, 520px 25%, 525px 35%, 555px 35%, 560px 70%,
      610px 70%, 615px 50%, 650px 50%, 655px 70%,
      710px 70%, 715px 55%, 750px 55%, 755px 38%, 775px 38%, 780px 55%, 815px 55%, 820px 70%,
      870px 70%, 875px 60%, 910px 60%, 915px 70%,
      970px 70%, 975px 45%, 1010px 45%, 1015px 32%, 1040px 32%, 1045px 45%, 1075px 45%, 1080px 70%,
      1130px 70%, 1135px 58%, 1180px 58%, 1185px 70%,
      1200px 70%, 1200px 100%
    );
  }

  .container {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 90px;
  }

  .wordmark {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 34px;
    letter-spacing: 0.18em;
    color: white;
  }
  .wordmark .a { color: #FF4D6A; }

  .main {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    margin-top: -40px;
  }

  .pretitle-1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 38px;
    color: rgba(255,255,255,0.78);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }
  .pretitle-2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 38px;
    color: rgba(255,255,255,0.78);
    margin-bottom: 50px;
  }

  .hero {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 94px;
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin-bottom: 56px;
    color: white;
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(255,255,255,0.85);
    margin-bottom: 70px;
    max-width: 920px;
  }
  .tagline strong { color: white; font-weight: 600; }

  .facts {
    display: flex;
    gap: 70px;
    margin-bottom: 70px;
    align-items: center;
  }

  .fact { text-align: center; }
  .fact-num {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 78px;
    line-height: 1;
    color: white;
  }
  .fact-label {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-top: 10px;
  }
  .fact-divider {
    width: 1px; height: 50px;
    background: rgba(255,255,255,0.15);
  }

  .url {
    font-family: 'Inter', sans-serif;
    font-size: 38px;
    font-weight: 700;
    color: #FF4D6A;
    letter-spacing: 0.01em;
  }

  .footer {
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    position: relative; z-index: 3;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="aurora"></div>
  <div class="skyline"></div>

  <div class="container">
    <div class="wordmark"><span class="a">A</span>NKOMMER</div>

    <div class="main">
      <div class="pretitle-1">You just landed.</div>
      <div class="pretitle-2">Or you're about to.</div>

      <div class="hero">Either way —<br>we've got you.</div>

      <div class="tagline">
        A free, AI-native guide for newcomers to Denmark.<br>
        In <strong>10 languages</strong>. No ads. No signup.
      </div>

      <div class="facts">
        <div class="fact">
          <div class="fact-num">16</div>
          <div class="fact-label">Chapters</div>
        </div>
        <div class="fact-divider"></div>
        <div class="fact">
          <div class="fact-num">10</div>
          <div class="fact-label">Languages</div>
        </div>
        <div class="fact-divider"></div>
        <div class="fact">
          <div class="fact-num">9</div>
          <div class="fact-label">Smart Tools</div>
        </div>
      </div>

      <div class="url">ankommer.org</div>
    </div>

    <div class="footer">Free at the point of access · Built independently</div>
  </div>
</body>
</html>
